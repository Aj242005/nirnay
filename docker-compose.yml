services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - uploads_data:/data/uploads
      - exports_data:/data/exports
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  officer-portal:
    build:
      context: .
      dockerfile: apps/officer-portal/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  bidder-portal:
    build:
      context: .
      dockerfile: apps/bidder-portal/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - backend

  landing-page:
    build:
      context: .
      dockerfile: apps/landing-page/Dockerfile
    ports:
      - "5175:80"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nirnay
      POSTGRES_USER: nirnay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirnay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  uploads_data:
  exports_data:
